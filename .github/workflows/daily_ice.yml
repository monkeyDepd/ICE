name: Daily ICE API Download and Email Report

on:
  schedule:
    # GitHub cron is UTC-only and DST-unaware: every line fires year-round, so
    # a "one for EDT, one for EST" pair just runs twice a day. Instead pick the
    # single UTC time that is acceptable in both regimes. 23:30 UTC is 19:30 ET
    # under EDT and 18:30 ET under EST -- both past the pre-18:00 ET publish and
    # past the script's 18:00 ET rollback cutoff.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

jobs:
  run-ice-api:
    runs-on: ubuntu-latest

    env:
      SAVE_DIR: ${{ github.workspace }}/ICE_CLEARED_POWER
      ICE_USERNAME: ${{ secrets.ICE_USERNAME }}
      ICE_PASSWORD: ${{ secrets.ICE_PASSWORD }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run ICE API script
        run: |
          python ice_auto.py
